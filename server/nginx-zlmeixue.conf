# 文章库站点（由 deploy.sh 生成/覆盖，也可单独 curl 下来安装）
# 访问地址：http://<服务器IP>:8090/zlmeixue/
server {
    listen 8090 default_server;
    listen [::]:8090 default_server;
    server_name _;
    charset utf-8;
    server_tokens off;

    root /opt/zlmeixue/site;
    index index.html;

    # 根路径跳到带前缀的地址，对外只暴露 /zlmeixue/
    location = / {
        return 302 /zlmeixue/;
    }
    location = /zlmeixue {
        return 301 /zlmeixue/;
    }

    # 用 alias 把 /zlmeixue/ 映射到站点目录，页面里的相对路径 articles.json 也能命中
    location /zlmeixue/ {
        alias /opt/zlmeixue/site/;
        index index.html;
        add_header Cache-Control "no-cache";
    }

    # 数据文件不缓存，刷新后立刻生效
    location = /zlmeixue/articles.json {
        alias /opt/zlmeixue/site/articles.json;
        add_header Cache-Control "no-store";
    }

    # 任何想摸脚本/数据的路径一律 403
    location ~* /zlmeixue/.*\.(py|xlsx|log|sh)$ {
        deny all;
    }

    access_log /opt/zlmeixue/logs/access.log;
}
